name: First-party Extension release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current-main source to resume once
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-extension-release-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || vars.INKCRE_WEB_PRODUCTION_PAUSED != 'true'
    name: Reconcile first-party Extension release plan
    permissions:
      contents: write
      packages: read
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - name: Validate exact protected-main source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        with:
          script: |
            const main = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' })
            if (context.ref !== 'refs/heads/main' || !/^[0-9a-f]{40}$/.test(process.env.SOURCE_SHA) || main.data.object.sha !== process.env.SOURCE_SHA) {
              core.setFailed('Publication requires the exact current protected-main source.')
            }
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Version PR must open with an installation token: PRs created by the
      # default GITHUB_TOKEN never trigger CI (GitHub suppresses GITHUB_TOKEN
      # events), so the PR could not satisfy the branch ruleset.
      - name: Mint the release-app installation token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.1
        id: release-app-token
        with:
          app-id: ${{ secrets.INKCRE_RELEASE_APP_ID }}
          private-key: ${{ secrets.INKCRE_RELEASE_APP_PRIVATE_KEY }}
          owner: InKCre
          repositories: impl-ts
      - name: Create or update the Extension Version PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.release-app-token.outputs.token }}
          version-script: pnpm release:version
          pr-title: 'chore(extensions): version pending releases'
          commit-message: 'chore(extensions): version pending releases'
          pr-base-branch: main
          create-github-releases: false
          push-git-tags: false

  candidate:
    name: Build or restore first-party MF candidate
    needs: reconcile
    permissions:
      contents: read
      packages: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      INKCRE_EXTENSION_REGISTRY_URL: >-
        ${{ vars.INKCRE_EXTENSION_REGISTRY_URL || 'https://registry.inkcre.dev' }}
      SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
      SOURCE_REVISION: ${{ inputs.source_sha || github.sha }}
    outputs:
      artifact_id: ${{ steps.saved.outputs.artifact_id || steps.retained.outputs.artifact-id }}
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set Changesets baseline to the exact release revision
        run: git branch main "$SOURCE_REVISION"

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node for release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen release workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate this run's saved release candidate
        id: saved
        run: node scripts/publish-first-party-extensions.mjs locate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the original release candidate
        if: steps.saved.outputs.artifact_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.saved.outputs.artifact_id }}
          path: .extension-delivery
          merge-multiple: true

      - name: Build first-party MF distributions
        if: steps.saved.outputs.artifact_id == ''
        run: |
          pnpm --filter @inkcre/core build
          pnpm --filter './extensions/*' build

      - name: Capture missing first-party MF candidates
        if: steps.saved.outputs.artifact_id == ''
        run: node scripts/publish-first-party-extensions.mjs capture

      - name: Verify candidate identity and ZIP digests
        run: node scripts/publish-first-party-extensions.mjs check

      - name: Retain the exact candidate before Registry writes
        if: steps.saved.outputs.artifact_id == ''
        id: retained
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-party-extension-candidate
          path: .extension-delivery
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish first-party MF distributions
    needs: candidate
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Checkout the release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.11.0

      - name: Set up Node for publication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@inkcre'

      - name: Install the frozen release workspace
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download this run's exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: .extension-delivery
          merge-multiple: true

      - name: Publish or recover and verify every selected candidate
        env:
          INKCRE_EXTENSION_REGISTRY_URL: >-
            ${{ vars.INKCRE_EXTENSION_REGISTRY_URL || 'https://registry.inkcre.dev' }}
          INKCRE_EXTENSION_REGISTRY_TOKEN: ${{ secrets.INKCRE_EXTENSION_REGISTRY_TOKEN }}
          SOURCE_REPOSITORY: https://github.com/${{ github.repository }}
          SOURCE_REVISION: ${{ inputs.source_sha || github.sha }}
        run: node scripts/publish-first-party-extensions.mjs publish
